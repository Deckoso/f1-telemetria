name: testes e executável

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q

  exe-windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.16.0
      - run: pyinstaller --onefile --console --name F1Telemetria executavel.py
      - name: teste de fumaça do .exe
        shell: pwsh
        run: |
          .\dist\F1Telemetria.exe --versao
          .\dist\F1Telemetria.exe sintetico --minutos 0.05 --velocidade 0 --porta 9
      - uses: actions/upload-artifact@v4
        with:
          name: F1Telemetria-windows
          path: |
            dist/F1Telemetria.exe
            GUIA-DO-PILOTO.md
          retention-days: 30
