name: testes e executável

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q

  exe-windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.16.0
      - run: pyinstaller --onefile --console --name F1Telemetria executavel.py
      - name: teste de fumaça do .exe
        shell: pwsh
        run: |
          .\dist\F1Telemetria.exe --versao
          .\dist\F1Telemetria.exe sintetico --minutos 0.05 --velocidade 0 --porta 9
          python -c "import sys; sys.path.insert(0, '.'); from tests import pista_sintetica as ps; ps.gravar('smoke.f1rec', [{}, {}, {1: 25}])"
          .\dist\F1Telemetria.exe analisar smoke.f1rec --saida smoke --sem-navegador
          if (-not (Select-String -Path smoke\smoke.html -Pattern "Onde você perde tempo" -Quiet)) { throw "análise do .exe falhou" }
      - name: montar o pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory pacote | Out-Null
          Copy-Item dist\F1Telemetria.exe, GUIA-DO-PILOTO.md, "distribuicao\*.bat" pacote\
          Compress-Archive -Path pacote\* -DestinationPath F1Telemetria-windows.zip
          (Get-FileHash dist\F1Telemetria.exe -Algorithm SHA256).Hash.ToLower() + "  F1Telemetria.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          (Get-FileHash F1Telemetria-windows.zip -Algorithm SHA256).Hash.ToLower() + "  F1Telemetria-windows.zip" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: F1Telemetria-windows
          path: |
            F1Telemetria-windows.zip
            SHA256SUMS.txt
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exe-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: F1Telemetria-windows
      - name: publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Gravador de telemetria do F1 25 para Windows (jogo no Xbox, PlayStation ou PC)."
            echo
            echo "1. Baixe **F1Telemetria-windows.zip** e extraia numa pasta."
            echo "2. Siga o GUIA-DO-PILOTO.md que vem dentro."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notas.md
          gh release create "$TAG" F1Telemetria-windows.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "F1 Telemetria $TAG" --notes-file notas.md
